services:
  datacore:
    build: .
    container_name: datacore
    restart: unless-stopped
    ports:
      - '${DATACORE_PORT:-3737}:3737'
    volumes:
      - datacore-data:/app/data
    environment:
      DATACORE_PASSWORD: ${DATACORE_PASSWORD:?set DATACORE_PASSWORD in your .env}
      SESSION_SECRET: ${SESSION_SECRET:-}
      DATACORE_HOST: ${DATACORE_HOST:-localhost}
      PORT: 3737
      # An engine is only enabled when its *_HOST is set. Use the compose
      # service names (postgres/mysql/mariadb/mongo) when running in a single
      # project, or a host address for remote engines.
      POSTGRES_HOST: ${POSTGRES_HOST:-}
      MYSQL_HOST: ${MYSQL_HOST:-}
      MARIADB_HOST: ${MARIADB_HOST:-}
      MONGO_HOST: ${MONGO_HOST:-}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MARIADB_PORT: ${MARIADB_PORT:-3306}
      MONGO_PORT: ${MONGO_PORT:-27017}
      POSTGRES_SUPERUSER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_SUPERPASSWORD: ${POSTGRES_SUPERPASSWORD:-datacore_pass}
      MYSQL_SUPERUSER: ${MYSQL_SUPERUSER:-root}
      MYSQL_SUPERPASSWORD: ${MYSQL_SUPERPASSWORD:-datacore_pass}
      MARIADB_SUPERUSER: ${MARIADB_SUPERUSER:-root}
      MARIADB_SUPERPASSWORD: ${MARIADB_SUPERPASSWORD:-datacore_pass}
      MONGO_SUPERUSER: ${MONGO_SUPERUSER:-}
      MONGO_SUPERPASSWORD: ${MONGO_SUPERPASSWORD:-}
    depends_on:
      - postgres
      - mysql
      - mariadb
      - mongo

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: datacore-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASSWORD:-datacore_pass}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8}
    container_name: datacore-mysql
    restart: unless-stopped
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${MYSQL_SUPERPASSWORD:-datacore_pass}}
    volumes:
      - mysql-data:/var/lib/mysql

  mariadb:
    image: ${MARIADB_IMAGE:-mariadb:11}
    container_name: datacore-mariadb
    restart: unless-stopped
    ports:
      - '${MARIADB_PORT:-3306}:3306'
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-${MARIADB_SUPERPASSWORD:-datacore_pass}}
    volumes:
      - mariadb-data:/var/lib/mysql

  mongo:
    image: ${MONGO_IMAGE:-mongo:7}
    container_name: datacore-mongo
    restart: unless-stopped
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db

volumes:
  datacore-data:
  postgres-data:
  mysql-data:
  mariadb-data:
  mongo-data:
