<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in &middot; DataCore</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="auth-body">
    <div class="auth-split">
      <aside class="auth-brand">
        <div class="auth-brand-head">
          <span class="auth-mark">&gt;_</span>
          <span class="auth-wordmark">DataCore<span class="auth-cursor"></span></span>
        </div>

        <div class="auth-console">
          <p class="auth-console-label">configured engines</p>
          <div class="auth-engine-list">{{engineChips}}</div>
        </div>

        <p class="auth-foot">database management panel</p>
      </aside>

      <section class="auth-form-wrap">
        <form id="login-form" class="auth-form" novalidate>
          <h1>Sign in</h1>
          <p class="auth-hint">The panel is password protected.</p>
          <div class="form-group">
            <input
              name="password"
              id="auth-password"
              type="password"
              placeholder="Enter panel password"
              autocomplete="current-password"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary auth-submit">Unlock</button>
        </form>
      </section>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
