<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DataCore</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/">
          <img class="brand-mark" src="/favicon.png" />
          <h1>DataCore</h1>
        </a>
        <div class="topbar-actions">
          <button class="btn btn-sm" id="logout">Log out</button>
        </div>
      </div>
    </header>

    <main>
      <section class="engines">
        <h2>Engines</h2>
        <div class="engine-grid">{{engineCards}}</div>
      </section>

      <section class="databases">
        <div class="section-head">
          <h2>Databases <span class="count">{{dbCount}}</span></h2>
          <button class="btn btn-primary" id="open-create">Deploy database</button>
        </div>
        <div class="db-table-wrap">
          <table class="db-table">
            <thead>
              <tr>
                <th>Engine</th>
                <th>Name</th>
                <th>Status</th>
                <th>Users</th>
                <th class="actions">Actions</th>
              </tr>
            </thead>
            <tbody id="db-table">
              {{dbRows}}
            </tbody>
          </table>
        </div>
        <div id="db-empty" class="empty-state" {{emptyState}}>
          <p>No databases yet.</p>
          <p class="empty-hint">
            Deploy your first one with the <strong>Deploy database</strong> button.
          </p>
        </div>
      </section>
    </main>

    <script id="engine-data" type="application/json">
      {{enginesJson}}
    </script>
    <script src="/app.js"></script>
  </body>
</html>
